name: Build profile city

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "sprites/**", "profile.json", ".github/workflows/city.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0 numpy==2.1.3
      - name: Build SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --config profile.json --sprites sprites --out dist --readme README.md
      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: rebuild profile images"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
          echo "OUTPUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Pin README images to this build
        # A commit-SHA URL never changes content, so GitHub's image proxy can't serve a stale copy.
        run: |
          sed -E -i "s#(raw\.githubusercontent\.com/${{ github.repository }}/)[^/]+/([^\"?]+\.svg)#\1${OUTPUT_SHA}/\2#g" README.md
      - name: Commit README if it changed
        run: |
          if ! git diff --quiet README.md; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: point README at latest profile images" README.md
            git push origin HEAD:main
          fi
