<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-label="red lightsaber divider"><title>red lightsaber divider</title><style>
.tw{animation:tw 5s ease-in-out infinite both}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.blade{transform-box:fill-box;transform-origin:0% 50%;animation:ignite 14s cubic-bezier(.2,.9,.2,1) infinite both}@keyframes ignite{0%{transform:scaleX(0)}5%{transform:scaleX(1)}90%{transform:scaleX(1);animation-timing-function:cubic-bezier(.7,0,.9,.4)}95%,100%{transform:scaleX(0)}}.hum{animation:hum .11s steps(2,jump-none) infinite}@keyframes hum{0%{opacity:.85}100%{opacity:1}}</style><defs><clipPath id="card"><rect width="1200" height="56" rx="0"/></clipPath><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e8ef"/><stop offset=".5" stop-color="#8b929e"/><stop offset="1" stop-color="#4b505a"/></linearGradient><filter id="bl" x="-5%" y="-100%" width="110%" height="300%"><feGaussianBlur stdDeviation="7"/></filter><filter id="bl2" x="-5%" y="-100%" width="110%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter></defs><g clip-path="url(#card)"><g transform="translate(1200 0) scale(-1 1)"><g class="blade"><g class="hum"><rect x="128" y="14.0" width="1038" height="28" rx="14" fill="#ff3b3b" opacity=".16" filter="url(#bl)"/><rect x="128" y="22.0" width="1038" height="12" rx="6" fill="#ff3b3b" opacity=".75" filter="url(#bl2)"/><rect x="128" y="25.6" width="1038" height="4.8" rx="2.4" fill="#fff"/></g></g><rect x="34" y="21.0" width="94" height="14" rx="3" fill="url(#metal)"/><rect x="44" y="21.0" width="3.2" height="14" fill="#1c1f26"/><rect x="51" y="21.0" width="3.2" height="14" fill="#1c1f26"/><rect x="58" y="21.0" width="3.2" height="14" fill="#1c1f26"/><rect x="65" y="21.0" width="3.2" height="14" fill="#1c1f26"/><rect x="72" y="21.0" width="3.2" height="14" fill="#1c1f26"/><rect x="79" y="21.0" width="3.2" height="14" fill="#1c1f26"/><rect x="94" y="19.0" width="12" height="18" rx="2" fill="#3a3f4a"/><rect x="96" y="25.0" width="8" height="3" rx="1" fill="#c33"/><rect x="116" y="18.0" width="12" height="20" rx="2" fill="url(#metal)"/></g></g></svg>